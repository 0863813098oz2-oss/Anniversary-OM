<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>นับวันที่เรารักกัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#1e1219;--card:#2a1822;--ink:#fbe9ec;--mute:#b99aa6;--rose:#ff7a9c;--track:#44283a;--peach:#f4b6a0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Mali","Sarabun","Noto Sans Thai",system-ui,sans-serif;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
h1{font-size:1.15rem;font-weight:600;margin:8px 0 0;color:var(--mute)}
.ring{position:relative;width:min(78vw,300px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.t{stroke:var(--track)}
.p{stroke:var(--rose);transition:stroke-dashoffset 1.2s ease}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.num{font-size:clamp(3.6rem,20vw,5.2rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--rose)}
.unit{font-size:1.1rem;color:var(--mute);margin-top:4px}
.ymd{font-size:1.25rem;font-weight:600}
.sec{font-size:.95rem;color:var(--mute);font-variant-numeric:tabular-nums}
.card{width:100%;background:var(--card);border-radius:20px;padding:16px 18px;text-align:left;box-shadow:0 1px 0 var(--track)}
.card b{color:var(--rose)}
.card small{display:block;color:var(--mute);margin-top:2px}
.bar{height:8px;border-radius:8px;background:var(--track);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--peach),var(--rose));width:0;transition:width 1.2s ease}
button{font:inherit;color:var(--ink);background:transparent;border:1.5px solid var(--track);border-radius:999px;padding:10px 18px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.edit{display:none;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.edit.on{display:flex}
input[type=date]{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--track);border-radius:12px;padding:9px 12px}
.save{background:var(--rose);color:#fff;border-color:var(--rose)}
[hidden]{display:none!important}
.album{width:100%;text-align:left}
.ah{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ah h2{font-size:1.15rem;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{padding:6px 14px;font-size:.9rem}
.form{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.form input,.form textarea{width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--track);border-radius:12px;padding:9px 12px;resize:vertical}
.form textarea:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.thumbs:empty{display:none}
.thumbs>div{position:relative;aspect-ratio:1}
.thumbs img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
.thumbs button{position:absolute;top:4px;right:4px;width:26px;height:26px;padding:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:none;font-size:16px;line-height:1}
.gw{position:relative}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.mc .gal img{flex:0 0 100%;scroll-snap-align:start}
.cnt{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:.8rem;padding:2px 10px;border-radius:999px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:0;width:2px;background:var(--track)}
.mi{position:relative;margin-bottom:20px}
.mi::before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--rose);border:3px solid var(--bg);box-sizing:content-box;margin-left:-3px}
.md{font-size:.85rem;color:var(--mute);margin-bottom:6px}
.mc{padding:0;overflow:hidden}
.mc img{width:100%;max-height:340px;object-fit:cover;display:block}
.mb{padding:14px 16px}
.mb h3{font-size:1.05rem;margin:0 0 6px}
.mb p{margin:0 0 12px;color:var(--mute);line-height:1.7;font-size:.95rem;white-space:pre-wrap}
.none{color:var(--mute);text-align:center;margin:8px 0 0}
.player{display:flex;align-items:center;gap:14px}
#playBtn{width:48px;height:48px;padding:0;flex:none;display:flex;align-items:center;justify-content:center;background:var(--rose);border-color:var(--rose);color:#fff}
.pinfo{flex:1;min-width:0}
#songName{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:6px;border-radius:6px;background:var(--track);margin:10px 0 4px;cursor:pointer;position:relative}
.pbar::after{content:"";position:absolute;inset:-10px 0}
.pbar i{display:block;height:100%;width:0;border-radius:6px;background:var(--rose)}
@media (prefers-reduced-motion:reduce){.p,.bar i{transition:none}}
</style>
</head>
<body>
<main>
  <h1>ความทรงจำ</h1>
  <div class="ring">
    <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="t" cx="60" cy="60" r="52"/><circle class="p" id="p" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
    <div class="mid"><div class="num" id="days">0</div><div class="unit">วัน</div></div>
  </div>
  <div>
    <div class="ymd" id="ymd"></div>
    <div class="sec" id="sec"></div>
    <div class="sec" id="since"></div>
  </div>
  <div class="card">
    <div id="next"></div>
    <small id="nextDate"></small>
    <div class="bar"><i id="bar"></i></div>
  </div>
  <div class="card player">
    <button id="playBtn" aria-label="เล่นหรือหยุดเพลง"></button>
    <div class="pinfo">
      <div id="songName"></div>
      <div class="pbar" id="pbar"><i id="pfill"></i></div>
      <small id="ptime"></small>
    </div>
    <audio id="aud" src="song.mp3" preload="none" loop></audio>
  </div>
  <section class="album">
    <div class="ah"><h2>ความทรงจำของเรา</h2><button class="save" id="addBtn">+ เพิ่ม</button></div>
    <div class="card form" id="form" hidden>
      <div class="pick"><div class="thumbs" id="thumbs"></div><button id="pickBtn">+ เพิ่มรูป</button></div>
      <input type="date" id="dtIn" aria-label="วันที่">
      <input id="tIn" maxlength="60" placeholder="หัวข้อ เช่น วันแรกที่ไปเที่ยวด้วยกัน">
      <textarea id="dIn" rows="4" placeholder="เล่าว่ารูปนี้ถ่ายมาได้ยังไง..."></textarea>
      <div class="row"><button class="save" id="saveBtn">บันทึก</button><button id="cancelBtn">ยกเลิก</button></div>
    </div>
    <p class="none" id="st" hidden></p>
    <div class="tl" id="tl"></div>
    <p class="none" id="none">ยังไม่มีความทรงจำ กด + เพิ่ม เพื่อเริ่มเล่าเรื่องของเรา</p>
    <input type="file" id="file" accept="image/*" multiple hidden>
  </section>
</main>
<script>
const START="2026-08-30",MAXP=10;
const SONG_NAME="เพลงของเรา"; // เปลี่ยนชื่อเพลงตรงนี้ ไฟล์เพลงต้องชื่อ song.mp3
const DBURL="https://bat-neua-default-rtdb.asia-southeast1.firebasedatabase.app", ROOT="love_7a3b5a9d4a4826";
const $=id=>document.getElementById(id);
const nf=new Intl.NumberFormat("th-TH");
const fmt=d=>d.toLocaleDateString("th-TH",{day:"numeric",month:"long",year:"numeric"});
const MILES=[100,200,300,365,500,730,1000,1095,1500,2000,2500,3000,3650,5000];
const startStr=START;

const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const dayDiff=(a,b)=>Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/864e5);

function ymd(from,to){
  let y=to.getFullYear()-from.getFullYear(),m=to.getMonth()-from.getMonth(),d=to.getDate()-from.getDate();
  if(d<0){m--;d+=new Date(to.getFullYear(),to.getMonth(),0).getDate()}
  if(m<0){y--;m+=12}
  return[y,m,d];
}

function render(){
  const start=parse(startStr),now=new Date();
  const days=dayDiff(start,now);
  $("since").textContent="เริ่มคบกันเมื่อ "+fmt(start);
  if(days<0){
    $("days").textContent=nf.format(-days);
    document.querySelector("h1").textContent="อีกไม่นานเราจะได้คบกัน";
    $("ymd").textContent="";$("sec").textContent="";
    $("next").innerHTML="ยังไม่ถึงวันเริ่มคบ";$("nextDate").textContent="";
    return;
  }
  document.querySelector("h1").textContent="เราคบกันมาแล้ว";
  $("days").textContent=nf.format(days);
  const [y,m,d]=ymd(start,now);
  $("ymd").textContent=[y&&y+" ปี",m&&m+" เดือน",d&&d+" วัน"].filter(Boolean).join(" ")||"วันแรกของเรา";
  const secs=Math.floor((now-start)/1000);
  $("sec").textContent="หรือ "+nf.format(secs)+" วินาที";

  const prev=[0,...MILES].filter(x=>x<=days).pop();
  let nxt=MILES.find(x=>x>days);
  if(!nxt)nxt=Math.ceil((days+1)/1000)*1000;
  const left=nxt-days,date=new Date(start);date.setDate(date.getDate()+nxt);
  $("next").innerHTML="อีก <b>"+nf.format(left)+" วัน</b> ครบ "+nf.format(nxt)+" วัน";
  $("nextDate").textContent="ตรงกับ "+fmt(date);
  const pct=(days-prev)/(nxt-prev);
  $("bar").style.width=(pct*100)+"%";
  $("p").style.strokeDashoffset=326.7*(1-pct);

}


let mem=[],tree={},editId=null,tmpPhotos=[],es=null;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const url=id=>DBURL+"/"+ROOT+(id?"/"+id:"")+".json";
const status=t=>{$("st").textContent=t||"";$("st").hidden=!t};
const fail=()=>status("บันทึกไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตหรือ Rules ใน Firebase");
const put=async m=>{try{const r=await fetch(url(m.id),{method:"PUT",body:JSON.stringify({date:m.date,photos:m.photos||[],t:m.t,d:m.d})});return r.ok}catch(e){return false}};
const del=async id=>{try{const r=await fetch(url(id),{method:"DELETE"});return r.ok}catch(e){return false}};

function sync(){
  mem=Object.entries(tree||{}).filter(([,v])=>v&&typeof v==="object").map(([id,v])=>({id,date:v.date||START,photos:(v.photos?(Array.isArray(v.photos)?v.photos:Object.values(v.photos)):(v.photo?[v.photo]:[])).filter(Boolean),t:v.t||"",d:v.d||""}));
  renderMem();
}
function applyEv(path,data,merge){
  const parts=path.split("/").filter(Boolean);
  if(!parts.length){
    if(merge){tree=tree||{};Object.keys(data||{}).forEach(k=>{data[k]===null?delete tree[k]:tree[k]=data[k]})}
    else tree=data||{};
    return;
  }
  tree=tree||{};let o=tree;
  for(let i=0;i<parts.length-1;i++){if(!o[parts[i]]||typeof o[parts[i]]!=="object")o[parts[i]]={};o=o[parts[i]]}
  const k=parts[parts.length-1];
  if(merge){o[k]=o[k]||{};Object.keys(data||{}).forEach(x=>{data[x]===null?delete o[k][x]:o[k][x]=data[x]})}
  else if(data===null)delete o[k];else o[k]=data;
}
function connect(){
  if(es)es.close();
  es=new EventSource(url());
  const on=(ev,merge)=>es.addEventListener(ev,e=>{try{const x=JSON.parse(e.data);applyEv(x.path,x.data,merge);sync();status("")}catch(err){}});
  on("put",false);on("patch",true);
  es.addEventListener("cancel",()=>status("ไม่มีสิทธิ์อ่านข้อมูล ตรวจสอบ Rules ใน Firebase"));
  es.onerror=()=>{status("กำลังเชื่อมต่อใหม่...");if(es.readyState===2)setTimeout(connect,8000)};
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&(!es||es.readyState===2))connect()});

async function migrate(){
  try{
    const db=await new Promise((res,rej)=>{const r=indexedDB.open("love-album",1);r.onupgradeneeded=()=>r.result.createObjectStore("m",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej()});
    const old=await new Promise((res,rej)=>{const t=db.transaction("m","readonly");const q=t.objectStore("m").getAll();t.oncomplete=()=>res(q.result);t.onerror=()=>rej()});
    if(!old.length)return;
    for(const m of old){if(!await put({...m,id:String(m.id),photos:m.photo?[m.photo]:[]}))return}
    db.transaction("m","readwrite").objectStore("m").clear();
  }catch(e){}
}

function renderMem(){
  const tl=$("tl");tl.textContent="";
  $("none").hidden=mem.length>0;
  [...mem].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).forEach(m=>{
    const it=el("article","mi");
    it.append(el("div","md",fmt(parse(m.date))));
    const c=el("div","card mc");
    if(m.photos.length){
      const gw=el("div","gw"),g=el("div","gal");
      m.photos.forEach(u=>{const im=el("img");im.src=u;im.alt=m.t||"รูปของเรา";im.loading="lazy";g.append(im)});
      gw.append(g);
      if(m.photos.length>1){const n=el("div","cnt","1/"+m.photos.length);g.onscroll=()=>{n.textContent=(Math.round(g.scrollLeft/g.clientWidth)+1)+"/"+m.photos.length};gw.append(n)}
      c.append(gw);
    }
    const b=el("div","mb");
    if(m.t)b.append(el("h3","",m.t));
    if(m.d)b.append(el("p","",m.d));
    const r=el("div","row");
    const e=el("button","","แก้ไข");e.onclick=()=>openForm(m);
    const x=el("button","","ลบ");let armed=false;
    x.onclick=async()=>{
      if(!armed){armed=true;x.textContent="กดอีกครั้งเพื่อลบ";setTimeout(()=>{armed=false;x.textContent="ลบ"},3000);return}
      delete tree[m.id];sync();if(!await del(m.id))fail();
    };
    r.append(e,x);b.append(r);c.append(b);it.append(c);tl.append(it);
  });
}

function showPv(){
  const t=$("thumbs");t.textContent="";
  tmpPhotos.forEach((u,i)=>{const w=el("div"),im=el("img"),x=el("button","","×");im.src=u;im.alt="";x.setAttribute("aria-label","เอารูปออก");x.onclick=()=>{tmpPhotos.splice(i,1);showPv()};w.append(im,x);t.append(w)});
  $("pickBtn").textContent=tmpPhotos.length?"+ เพิ่มรูปอีก":"+ เพิ่มรูป";
}
function openForm(m){
  editId=m?m.id:null;tmpPhotos=m?[...m.photos]:[];
  $("dtIn").value=m?m.date:today();$("tIn").value=m?m.t:"";$("dIn").value=m?m.d:"";
  showPv();$("form").hidden=false;$("addBtn").hidden=true;
  $("form").scrollIntoView({block:"nearest"});
}
function closeForm(){$("form").hidden=true;$("addBtn").hidden=false}
$("addBtn").onclick=()=>openForm(null);
$("cancelBtn").onclick=closeForm;
$("pickBtn").onclick=()=>$("file").click();
$("saveBtn").onclick=async()=>{
  const t=$("tIn").value.trim(),d=$("dIn").value.trim();
  if(!tmpPhotos.length&&!t&&!d){$("tIn").focus();return}
  const m={id:editId||String(Date.now()),date:$("dtIn").value||today(),photos:[...tmpPhotos],t,d};
  tree=tree||{};tree[m.id]={date:m.date,photos:m.photos,t:m.t,d:m.d};sync();closeForm();
  if(!await put(m))fail();
};
const shrink=f=>new Promise((res,rej)=>{
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const k=Math.min(1,900/Math.max(im.width,im.height));
      const c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",.7));
    };
    im.onerror=rej;im.src=r.result;
  };
  r.onerror=rej;r.readAsDataURL(f);
});
$("file").onchange=async e=>{
  const files=[...e.target.files];e.target.value="";
  for(const f of files){
    if(tmpPhotos.length>=MAXP){status("ใส่ได้สูงสุด "+MAXP+" รูปต่อหนึ่งความทรงจำ");break}
    try{tmpPhotos.push(await shrink(f))}catch(err){}
    showPv();
  }
};

const aud=$("aud"),pb=$("playBtn");
const svg=d=>'<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="'+d+'"/></svg>';
const I_PLAY=svg("M8 5v14l11-7z"),I_PAUSE=svg("M6 5h4v14H6zM14 5h4v14h-4z");
const mmss=t=>isFinite(t)?Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0"):"0:00";
$("songName").textContent=SONG_NAME;pb.innerHTML=I_PLAY;
pb.onclick=()=>{aud.paused?aud.play().catch(()=>{$("ptime").textContent="เล่นไม่ได้ ตรวจสอบไฟล์ song.mp3"}):aud.pause()};
aud.onplay=()=>{pb.innerHTML=I_PAUSE};
aud.onpause=()=>{pb.innerHTML=I_PLAY};
const tick=()=>{if(aud.duration){$("pfill").style.width=(aud.currentTime/aud.duration*100)+"%";$("ptime").textContent=mmss(aud.currentTime)+" / "+mmss(aud.duration)}};
aud.ontimeupdate=tick;aud.onloadedmetadata=tick;
aud.onerror=()=>{$("ptime").textContent="ไม่พบไฟล์ song.mp3 ในโฟลเดอร์เดียวกับ index.html"};
$("pbar").onclick=e=>{if(!aud.duration)return;const r=$("pbar").getBoundingClientRect();aud.currentTime=aud.duration*Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))};
render();
connect();migrate();
setInterval(()=>{const s=Math.floor((new Date()-parse(startStr))/1000);if(s>=0)$("sec").textContent="หรือ "+nf.format(s)+" วินาที"},1000);
</script>
</body>
</html>
